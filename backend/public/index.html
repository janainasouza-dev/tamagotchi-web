<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagotchi Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .pet-emoji { font-size: 100px; margin: 20px 0; animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .status-bar { margin: 15px 0; }
        .status-label { display: block; margin-bottom: 5px; font-weight: bold; }
        .bar-container {
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
        }
        .bar { height: 100%; transition: width 0.3s; }
        .bar.hunger { background: #ff6b6b; }
        .bar.happiness { background: #4ecdc4; }
        .bar.energy { background: #ffe66d; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }
        button:hover { transform: translateY(-2px); }
        .btn-feed { background: #ff6b6b; color: white; }
        .btn-play { background: #4ecdc4; color: white; }
        .btn-sleep { background: #ffe66d; color: #333; }
        .create-pet input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px;
            width: 200px;
        }
        .create-pet button { background: #667eea; color: white; padding: 12px 24px; }
        h1 { color: #333; margin-bottom: 20px; }
        h2 { color: #667eea; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        let petId = localStorage.getItem('petId');

        async function createPet() {
            const name = document.getElementById('petName').value;
            if (!name) {
                alert('Por favor, digite um nome para seu pet!');
                return;
            }
            
            try {
                const response = await fetch('/api/pet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                
                const pet = await response.json();
                localStorage.setItem('petId', pet.id);
                petId = pet.id;
                render();
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao criar pet. Verifique se o servidor está rodando!');
            }
        }

        async function loadPet() {
            try {
                const response = await fetch(`/api/pet/${petId}`);
                if (!response.ok) throw new Error('Pet não encontrado');
                const pet = await response.json();
                
                document.getElementById('petName').textContent = pet.name;
                document.getElementById('hunger').textContent = Math.floor(pet.hunger);
                document.getElementById('happiness').textContent = Math.floor(pet.happiness);
                document.getElementById('energy').textContent = Math.floor(pet.energy);
                
                document.getElementById('hungerBar').style.width = `${pet.hunger}%`;
                document.getElementById('happinessBar').style.width = `${pet.happiness}%`;
                document.getElementById('energyBar').style.width = `${pet.energy}%`;
                
                let emoji = '🐶';
                if (pet.hunger < 20) emoji = '🍽️😢';
                else if (pet.happiness < 20) emoji = '😞';
                else if (pet.energy < 20) emoji = '😴';
                else if (pet.happiness > 80) emoji = '😊🎉';
                document.getElementById('petEmoji').textContent = emoji;
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function action(type) {
            try {
                await fetch(`/api/pet/${petId}/${type}`, { method: 'POST' });
                loadPet();
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao executar ação!');
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!petId) {
                app.innerHTML = `
                    <div class="container">
                        <h1>🐣 Tamagotchi Web</h1>
                        <div class="create-pet">
                            <input type="text" id="petName" placeholder="Nome do seu pet" onkeypress="if(event.key==='Enter') createPet()">
                            <br>
                            <button onclick="createPet()">Adotar Pet</button>
                        </div>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="container">
                        <div class="pet-emoji" id="petEmoji">🐶</div>
                        <h2 id="petName"></h2>
                        <div class="status-bar">
                            <div class="status-label">🍖 Fome: <span id="hunger">0</span>%</div>
                            <div class="bar-container">
                                <div class="bar hunger" id="hungerBar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="status-bar">
                            <div class="status-label">😊 Felicidade: <span id="happiness">0</span>%</div>
                            <div class="bar-container">
                                <div class="bar happiness" id="happinessBar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="status-bar">
                            <div class="status-label">⚡ Energia: <span id="energy">0</span>%</div>
                            <div class="bar-container">
                                <div class="bar energy" id="energyBar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-feed" onclick="action('feed')">🍎 Alimentar</button>
                            <button class="btn-play" onclick="action('play')">🎮 Brincar</button>
                            <button class="btn-sleep" onclick="action('sleep')">😴 Dormir</button>
                        </div>
                    </div>
                `;
                loadPet();
            }
        }

        // Atualizar stats a cada 30 segundos
        setInterval(() => { if (petId) loadPet(); }, 30000);
        
        render();
    </script>
</body>
</html>
